<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Host - Créer un Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f0f0; }
        .container { display: flex; padding: 20px; }
        .left, .right { background: white; padding: 20px; border-radius: 10px; margin: 10px; }
        .left { width: 40%; }
        .right { width: 60%; }
        input, button { margin: 5px; padding: 5px; }
        button { background: #ff6f61; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="left">
            <h2>Questions</h2>
            <ul id="questionList"></ul>
        </div>
        <div class="right">
            <h2>Créer une question</h2>
            <input id="question" type="text" placeholder="Question" style="width: 80%;"><br>
            <input id="image" type="file" accept="image/*"><br>
            <input id="opt1" type="text" placeholder="Option 1"><br>
            <input id="opt2" type="text" placeholder="Option 2"><br>
            <input id="opt3" type="text" placeholder="Option 3"><br>
            <input id="correct" type="number" placeholder="Bonne réponse (1-3)" min="1" max="3"><br>
            <button onclick="addQuestion()">Ajouter</button>
            <button onclick="generateCode()">Générer Code</button>
            <p id="code"></p>
        </div>
    </div>

    <script>
        let quiz = [];

        function addQuestion() {
            const question = document.getElementById('question').value;
            const imageInput = document.getElementById('image');
            const options = [
                document.getElementById('opt1').value,
                document.getElementById('opt2').value,
                document.getElementById('opt3').value
            ];
            const correct = parseInt(document.getElementById('correct').value) - 1;
            let image = null;
            if (imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = () => {
                    image = reader.result;
                    quiz.push({ question, image, options, correct });
                    updateQuestionList();
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                quiz.push({ question, image, options, correct });
                updateQuestionList();
            }
            clearForm();
        }

        function updateQuestionList() {
            const list = document.getElementById('questionList');
            list.innerHTML = '';
            quiz.forEach((q, i) => {
                const li = document.createElement('li');
                li.innerText = `${i + 1}. ${q.question}`;
                list.appendChild(li);
            });
        }

        function clearForm() {
            document.getElementById('question').value = '';
            document.getElementById('image').value = '';
            document.getElementById('opt1').value = '';
            document.getElementById('opt2').value = '';
            document.getElementById('opt3').value = '';
            document.getElementById('correct').value = '';
        }

        function generateCode() {
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById('code').innerText = `Code : ${code}`;
            localStorage.setItem('quiz', JSON.stringify(quiz));
            localStorage.setItem('quizCode', code);
        }
    </script>
</body>
</html>
